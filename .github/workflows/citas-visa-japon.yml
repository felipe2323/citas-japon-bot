name: Chequeo de citas Japon

# El disparo automatico lo hace un cron externo (cron-job.org) llamando a
# la API de GitHub, porque el 'schedule:' nativo de GitHub Actions nunca
# llego a dispararse en este repo (workflow_dispatch si funciona siempre).
# Por eso aqui solo queda workflow_dispatch: si algun dia se reactivara el
# schedule nativo, tendriamos corridas duplicadas y notificaciones dobles.
on:
  workflow_dispatch: {}

jobs:
  revisar:
    runs-on: ubuntu-latest
    # Red de seguridad: una corrida normal toma ~1 min. Sin esto el default de
    # GitHub son 6 HORAS, y una corrida atascada se comeria cientos de minutos
    # de la cuota. El tope va por encima del peor caso del script (que reintenta
    # con timeouts largos) para que el script alcance a fallar solo y mandar el
    # aviso por Telegram; si GitHub mata el job, ese aviso no se envia.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Cache del navegador de Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Instalar navegador de Playwright (sin cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Instalar solo dependencias del sistema (con cache de navegador)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Correr el chequeo
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADLESS: 'true'
        run: node index.js
